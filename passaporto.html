<title>Passaporto della moto · Moto Garage Marcello</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Pagina pubblica del passaporto: si apre inquadrando il QR dell'adesivo. Legge solo /passaporti/{CODICE}. */
:root {
  --carta: #f6f4ef; --foglio: #ffffff; --inchiostro: #16181d; --grigio: #646a75; --linea: #e3e0d8;
  --rosso: #c62828; --verde: #1b7a45; --verde-chiaro: #e3f3ea; --arancio: #9a5b00; --arancio-chiaro: #fdf1dc;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --testo: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--carta); color: var(--inchiostro); font: 16px/1.5 var(--testo); }
.pagina { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--carta); padding-bottom: env(safe-area-inset-bottom, 0px); }
.testa { background: var(--inchiostro); color: #fff; padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 18px; display: flex; align-items: center; gap: 14px; }
.testa img { width: 58px; height: 58px; border-radius: 12px; background: #fff; padding: 4px; object-fit: contain; flex-shrink: 0; }
.testa .t1 { font: 800 1.45rem/1 var(--display); letter-spacing: 0.8px; }
.testa .t2 { font-size: 0.82rem; color: #c9ccd3; margin-top: 3px; }
.moto { background: var(--foglio); padding: 18px 20px 16px; border-bottom: 1px solid var(--linea); }
.moto .nome { font: 800 1.7rem/1.05 var(--display); text-wrap: balance; }
.moto .det { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pill { font: 700 0.8rem/1 var(--testo); padding: 6px 9px; border-radius: 6px; background: #f0eee8; color: var(--inchiostro); }
.pill.targa { font-family: var(--mono); background: #fff; border: 2px solid var(--inchiostro); letter-spacing: 1px; }
.fiducia { margin: 14px 16px 0; background: var(--verde-chiaro); color: var(--verde); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 0.92rem; line-height: 1.3; }
.fiducia .s { font-size: 1.5rem; }
.prossimo { margin: 12px 16px 0; background: var(--foglio); border: 1px solid var(--linea); border-radius: 12px; padding: 14px; }
.prossimo .et { font: 700 0.72rem/1 var(--testo); letter-spacing: 1px; text-transform: uppercase; color: var(--grigio); }
.prossimo .val { font: 800 1.25rem/1.15 var(--display); margin-top: 6px; }
.prossimo.scaduto { border-color: #f3c27a; background: var(--arancio-chiaro); }
.prossimo.scaduto .val { color: var(--arancio); }
.barra { height: 8px; background: #eceae4; border-radius: 4px; margin-top: 10px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--verde); border-radius: 4px; }
.prossimo .nota { font-size: 0.8rem; color: var(--grigio); margin-top: 6px; }
.sezione { font: 800 1.05rem/1 var(--display); letter-spacing: 1px; text-transform: uppercase; color: var(--grigio); margin: 22px 20px 10px; }
.storia { list-style: none; margin: 0; padding: 0 16px 0 20px; }
.storia li { position: relative; padding: 0 0 18px 22px; border-left: 2px solid var(--linea); }
.storia li:last-child { border-left-color: transparent; }
.storia li::before { content: ""; position: absolute; left: -7px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--rosso); box-shadow: 0 0 0 3px var(--carta); }
.storia .quando { font: 700 0.82rem/1.2 var(--testo); color: var(--grigio); display: flex; gap: 8px; flex-wrap: wrap; }
.storia .km { font-family: var(--mono); }
.storia .cosa { font: 800 1.12rem/1.2 var(--display); margin-top: 3px; text-transform: none; }
.storia .ric { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.storia .ric span { font-size: 0.85rem; color: var(--grigio); }
.storia .firma { font-size: 0.75rem; color: var(--verde); font-weight: 700; margin-top: 6px; }
.azioni { margin: 8px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.btn { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 1rem; border: none; cursor: pointer; font-family: var(--testo); }
.btn.rosso { background: var(--rosso); color: #fff; }
.btn.chiaro { background: var(--foglio); color: var(--inchiostro); border: 1px solid var(--linea); }
.btn:focus-visible, input:focus-visible { outline: 3px solid #1565c0; outline-offset: 2px; }
.piede { margin: 20px 16px 0; padding-bottom: 30px; font-size: 0.78rem; color: var(--grigio); line-height: 1.5; text-align: center; }
.piede .cod { font-family: var(--mono); color: var(--inchiostro); font-weight: 700; letter-spacing: 1px; }
.messaggio { margin: 22px 16px 0; background: var(--foglio); border: 1px solid var(--linea); border-radius: 12px; padding: 18px 16px; }
.messaggio h1 { font: 800 1.4rem/1.15 var(--display); margin: 0 0 8px; }
.messaggio p { margin: 0 0 12px; color: var(--grigio); }
.messaggio form { display: flex; gap: 8px; flex-wrap: wrap; }
.messaggio input { flex: 1 1 200px; min-width: 0; font: 700 1rem/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; padding: 12px; border: 2px solid var(--linea); border-radius: 10px; background: #fff; color: var(--inchiostro); }
.attesa { text-align: center; color: var(--grigio); padding: 50px 16px; }
[hidden] { display: none !important; }
</style>
</head>

  <div id="contenuto"><div class="attesa">Carico il passaporto…</div></div>
  <div class="azioni">

  </div>
  <div class="piede" id="piede">Moto Garage Marcello · Ragusa · Tel. 0932 644902</div>
</div>
<script>
(function () {
  var DB = 'https://motogaragemarcello-18f47-default-rtdb.europe-west1.firebasedatabase.app';
  var MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  var el = document.getElementById('contenuto'), piede = document.getElementById('piede');
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
  function parti(iso) { var p = String(iso || '').split('-').map(Number); return p.length >= 2 && p[0] && p[1] ? p : null; }
  function dataLunga(iso) { var p = parti(iso); return p ? (p[2] ? p[2] + ' ' : '') + MESI[p[1] - 1] + ' ' + p[0] : ''; }
  function meseAnno(iso) { var p = parti(iso); return p ? MESI[p[1] - 1] + ' ' + p[0] : ''; }
  function km(n) { return n ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' km' : ''; }
  function leggibile(c) { return 'MGM-' + (String(c).match(/.{1,4}/g) || []).join('-'); }
  function lista(x) { return (Array.isArray(x) ? x : Object.values(x || {})).filter(Boolean); }
  function oggiIso() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function codiceDaHash() {
    var s = decodeURIComponent(location.hash.slice(1) || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (s.length === 15 && s.indexOf('MGM') === 0) s = s.slice(3);
    return /^[A-Z0-9]{12}$/.test(s) ? s : '';
  }
  function chiedi(titolo, testo) {
    el.innerHTML = '<div class="messaggio"><h1>' + esc(titolo) + '</h1><p>' + esc(testo) + '</p>' +
      '<form id="f"><label for="cod" hidden>Codice del passaporto</label><input id="cod" autocomplete="off" placeholder="MGM-XXXX-XXXX-XXXX" aria-label="Codice del passaporto"><button class="btn rosso" type="submit">Apri</button></form></div>';
    document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); location.hash = document.getElementById('cod').value.trim(); });
  }
  function mostra(c, d) {
    var interventi = lista(d.interventi), oggi = oggiIso(), n = interventi.length;
    var html = '<div class="moto"><div class="nome">' + esc(d.moto || 'Moto') + '</div><div class="det">' +
      (d.targa ? '<span class="pill targa">' + esc(d.targa) + '</span>' : '') + (d.km ? '<span class="pill">' + esc(km(d.km)) + '</span>' : '') + '</div></div>';
    if (n) html += '<div class="fiducia"><span class="s">🛡️</span><span>Moto seguita da Moto Garage Marcello' + (d.dal ? ' da ' + esc(meseAnno(d.dal)) : '') + ' · ' + n + (n === 1 ? ' intervento registrato' : ' interventi registrati') + ' dall\'officina</span></div>';
    if (d.prossimo) {
      var scad = d.prossimo < oggi, p = parti(d.prossimo), fine = new Date(p[0], p[1] - 1, p[2] || 1), inizio = new Date(p[0] - 1, p[1] - 1, p[2] || 1);
      var frac = Math.max(0.03, Math.min(1, (Date.now() - inizio) / (fine - inizio)));
      html += '<div class="prossimo' + (scad ? ' scaduto' : '') + '"><div class="et">Prossimo tagliando</div><div class="val">' + (scad ? 'Da fare: era previsto per ' + esc(meseAnno(d.prossimo)) : 'Entro ' + esc(meseAnno(d.prossimo))) + '</div>' +
        (scad ? '' : '<div class="barra"><i style="width:' + Math.round(frac * 100) + '%"></i></div>') +
        '<div class="nota">' + (interventi[0] ? 'Ultimo intervento: ' + esc(dataLunga(interventi[0].data)) + (interventi[0].km ? ' a ' + esc(km(interventi[0].km)) : '') + '.' : '') + '</div></div>';
    }
    html += '<div class="sezione">Interventi</div>';
    html += n ? '<ol class="storia">' + interventi.map(function (i) {
      var voci = lista(i.voci);
      return '<li><div class="quando"><span>' + esc(dataLunga(i.data)) + '</span>' + (i.km ? '<span class="km">· ' + esc(km(i.km)) + '</span>' : '') + '</div>' +
        '<div class="cosa">' + esc(i.titolo) + '</div>' +
        (voci.length ? '<div class="ric">' + voci.map(function (v) { return '<span>' + esc(v) + '</span>'; }).join('') + '</div>' : '') +
        '<div class="firma">✓ Registrato da Moto Garage Marcello</div></li>';
    }).join('') + '</ol>' : '<div class="messaggio"><p style="margin:0;">Il passaporto è attivo: gli interventi compariranno qui dopo il primo lavoro chiuso in officina.</p></div>';
    el.innerHTML = html;
    piede.innerHTML = 'Storico registrato direttamente dall\'officina a ogni intervento: il proprietario non può modificarlo.<br>Codice passaporto <span class="cod">' + esc(leggibile(c)) + '</span>' + (d.aggiornato ? ' · aggiornato il ' + esc(dataLunga(d.aggiornato)) : '') + '<br>Moto Garage Marcello · Ragusa · Tel. 0932 644902';
    document.title = (d.moto ? d.moto + ' · ' : '') + 'Passaporto della moto · Moto Garage Marcello';
  }
  function carica() {
    var c = codiceDaHash();
    if (!c) return chiedi('Passaporto della moto', 'Scrivi il codice che trovi sull\'adesivo, sotto il QR.');
    el.innerHTML = '<div class="attesa">Carico il passaporto…</div>';
    fetch(DB + '/passaporti/' + c + '.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.error) throw new Error(d.error);
        if (!d || typeof d !== 'object') return chiedi('Passaporto non trovato', 'Il codice non corrisponde a nessun passaporto attivo. Controlla di averlo scritto bene oppure chiamaci.');
        mostra(c, d);
      })
      .catch(function () {
        el.innerHTML = '<div class="messaggio"><h1>Passaporto momentaneamente non disponibile</h1><p>Non riesco a caricarlo adesso. Riprova tra qualche minuto oppure chiamaci.</p><button class="btn chiaro" type="button" id="riprova">↻ Riprova</button></div>';
        document.getElementById('riprova').addEventListener('click', carica);
      });
  }
  window.addEventListener('hashchange', carica);
  carica();
})();
</script>
